<rect x="740" y="200" width="120" height="55" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="800.0" y="221.5" text-anchor="middle" font-size="14" font-weight="600" fill="#111">LOAD out</text><text x="800.0" y="240.5" text-anchor="middle" font-size="11" fill="#444">12-48 V</text>
