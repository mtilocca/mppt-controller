<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica,Arial,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="1100" height="640" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="700">MPPT controller: block diagram (power in orange, control in blue, isolated comms in purple)</text>
<rect x="20" y="90" width="120" height="60" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="80.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">PV input</text><text x="80.0" y="133.0" text-anchor="middle" font-size="11" fill="#444">0-48 V (Voc max ~50 V)</text>
<rect x="170" y="90" width="150" height="60" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="245.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Protection</text><text x="245.0" y="133.0" text-anchor="middle" font-size="11" fill="#444">fuse, TVS, LM74700 ideal diode</text>
<rect x="350" y="70" width="190" height="100" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="445.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">LM5177 buck-boost</text><text x="445.0" y="133.0" text-anchor="middle" font-size="11" fill="#444">4 x 100 V FET, 10 uH, 151 kHz</text>
<rect x="570" y="90" width="140" height="60" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="640.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Battery bus</text><text x="640.0" y="133.0" text-anchor="middle" font-size="11" fill="#444">fuse, reverse-pol. FETs, 2 mOhm shunt</text>
<rect x="740" y="90" width="120" height="60" rx="8" fill="#fde7d4" stroke="#d4781f" stroke-width="1.5"/><text x="800.0" y="114.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Battery</text><text x="800.0" y="133.0" text-anchor="middle" font-size="11" fill="#444">12-48 V (58.5 V cap)</text>
