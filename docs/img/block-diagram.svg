<rect x="880" y="200" width="200" height="55" rx="8" fill="#e3f5e1" stroke="#3a9a3a" stroke-width="1.5"/><text x="980.0" y="221.5" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Aux supply</text><text x="980.0" y="240.5" text-anchor="middle" font-size="11" fill="#444">bus -> 9 V -> 5 V / 3V3 / 3V3A</text>
<rect x="880" y="280" width="200" height="55" rx="8" fill="#e3f5e1" stroke="#3a9a3a" stroke-width="1.5"/><text x="980.0" y="301.5" text-anchor="middle" font-size="14" font-weight="600" fill="#111">USB-C VBUS</text><text x="980.0" y="320.5" text-anchor="middle" font-size="11" fill="#444">PTC + diode into VAUX</text>
